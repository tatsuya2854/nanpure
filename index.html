<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナンプレであそぼう</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#3a2e1f;--line:#c9b99a;--thick:#6b5a3e;--given:#ece3cf;--sel:#ffe08a;--same:#d8f0ff;--bad:#e5484d;--main:#ff8a3d;--sub:#4aa8e8;--ok:#3bb273;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a14;--card:#2b251c;--ink:#f6ecd8;--line:#5b4f3b;--thick:#d9c8a3;--given:#3a3226;--sel:#7a5d12;--same:#1f4358;--bad:#ff7b80;--main:#ff9a58;--sub:#5ab6f0;--ok:#4cc88a}}
:root[data-theme="dark"]{--bg:#1e1a14;--card:#2b251c;--ink:#f6ecd8;--line:#5b4f3b;--thick:#d9c8a3;--given:#3a3226;--sel:#7a5d12;--same:#1f4358;--bad:#ff7b80;--main:#ff9a58;--sub:#5ab6f0;--ok:#4cc88a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","BIZ UDPGothic",sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:10px 10px 24px;min-height:100vh}
h1{font-size:clamp(20px,4vw,28px);margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0}
button{font:inherit;border:0;border-radius:14px;cursor:pointer;color:#fff;font-weight:700;touch-action:manipulation}
.lv{background:var(--sub);padding:10px 16px;font-size:clamp(15px,2.4vw,20px);opacity:.55}
.lv.on{opacity:1;outline:3px solid var(--ink)}
#info{display:flex;gap:20px;font-size:clamp(18px,3vw,28px);font-weight:700;margin:4px 0}
#board{container-type:inline-size;display:grid;width:min(96vw,62vh,680px);aspect-ratio:1;background:var(--card);border:4px solid var(--thick);border-radius:8px;overflow:hidden}
.c{line-height:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);font-size:min(64px,calc(100cqw / var(--n,9) * .62));font-weight:800;background:var(--card);color:var(--num,var(--sub));padding:0;border-radius:0}
.c.g{color:var(--ink);font-weight:900}
.c.a{background:var(--alt,#f3ead3)}
.c.h{background:var(--hl,#fff1c4)}
.c.s{background:var(--sel)}
.c.m{background:var(--same)}
.c.x{color:var(--bad)}
#pad{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;max-width:min(96vw,820px)}
#pad button{background:var(--main);width:clamp(52px,9vw,72px);height:clamp(52px,9vw,72px);font-size:clamp(28px,5.5vw,40px);border-radius:16px}
#pad button.e{background:#8a8a8a;width:auto;padding:0 16px;font-size:clamp(15px,3vw,20px)}
.act{padding:12px 18px;font-size:clamp(15px,2.6vw,20px)}
#hint{background:#b57edc}#again{background:var(--ok)}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:9}
#msg.show{display:flex}
#msg div{background:var(--card);border-radius:24px;padding:28px 34px;text-align:center;font-size:clamp(22px,5vw,34px);font-weight:800;max-width:86vw}
#msg p{font-size:clamp(16px,3vw,22px);margin:10px 0 18px;font-weight:600}
#msg button{background:var(--ok);padding:12px 22px;font-size:clamp(16px,3vw,22px)}
:root{--alt:#f3ead3;--hl:#fff1c4;--num:#1565c0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--alt:#352d21;--hl:#4a3d1e;--num:#8ccbff}}
:root[data-theme="dark"]{--alt:#352d21;--hl:#4a3d1e;--num:#8ccbff}
.lv{background:#2f80c8}#pad button{background:#e8590c}#pad button.e{background:#6b6b6b}#hint{background:#8e4fc4}#again{background:#1f9d5c}#rk{background:#b36b00}
input{user-select:text;font:inherit;font-size:clamp(18px,3vw,26px);padding:10px 14px;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(70vw,320px);text-align:center;margin-bottom:12px}
#msg .bt{padding:0;background:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:inherit}
#msg #sv{background:#e8590c}
#rank{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:10;padding:10px}
#rank.show{display:flex}
#rank>div{background:var(--card);border-radius:24px;padding:20px;width:min(96vw,640px);max-height:92vh;overflow:auto;text-align:center;font-size:clamp(18px,3vw,26px)}
#rank p{font-size:14px;margin:4px 0 8px;opacity:.8}
#rtabs button{background:#2f80c8;padding:8px 12px;font-size:clamp(14px,2.4vw,18px);opacity:.6}
#rtabs button.on{opacity:1;outline:3px solid var(--ink)}
.rr{display:grid;grid-template-columns:2.2em 1fr auto auto auto;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);font-size:clamp(14px,2.6vw,20px);text-align:left}
.rr.me{background:var(--sel)}
#rc{background:#6b6b6b;padding:10px 24px;font-size:clamp(16px,3vw,22px);margin-top:12px}
</style>
</head>
<body>
<h1>🔢 ナンプレであそぼう</h1>
<div class="row" id="lvs"></div>
<div id="info"><span id="tm">⏱ 0:00</span><span id="hc">💡 ヒント 3</span></div>
<div id="board"></div>
<div id="pad"></div>
<div class="row">
  <button class="act" id="hint">💡 ヒント</button>
  <button class="act" id="rk">🏆 ランキング</button>
  <button class="act" id="again">🔄 あたらしいもんだい</button>
</div>
<div id="msg"><div>🎉 クリア！すごい！<p id="mt"></p><input id="nm" maxlength="8" placeholder="ニックネーム" autocomplete="off"><div class="bt"><button id="sv">🏆 とうろく</button><button id="mb">もういちど</button></div></div></div>
<div id="rank"><div><b>🏆 ランキング</b><p id="rsrc"></p><div class="row" id="rtabs"></div><div id="rlist"></div><button id="rc">とじる</button></div></div>
<script>
const L={e:{t:"4×4 かんたん",n:4,br:2,bc:2,rm:8},m:{t:"6×6 ふつう",n:6,br:2,bc:3,rm:18},h:{t:"9×9 むずかしい",n:9,br:3,bc:3,rm:44},x:{t:"🔥 9×9 ハイレベル",n:9,br:3,bc:3,rm:55}};
let lv="e",cfg,sol,giv,cur,sel=-1,hints=3,t0=0,timer=null,done=false,att=0,okc=0,hu=0;
const $=id=>document.getElementById(id);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function ok(g,r,c,v){const{n,br,bc}=cfg;for(let i=0;i<n;i++){if(g[r*n+i]===v||g[i*n+c]===v)return false}
 const r0=r-r%br,c0=c-c%bc;for(let i=0;i<br;i++)for(let j=0;j<bc;j++)if(g[(r0+i)*n+c0+j]===v)return false;return true}
function fill(g){const n=cfg.n,i=g.indexOf(0);if(i<0)return true;const r=Math.floor(i/n),c=i%n;
 for(const v of shuf([...Array(n)].map((_,k)=>k+1)))if(ok(g,r,c,v)){g[i]=v;if(fill(g))return true;g[i]=0}return false}
function count(g,lim){const n=cfg.n;let bi=-1,bs=[];
 for(let i=0;i<g.length;i++)if(!g[i]){const r=Math.floor(i/n),c=i%n,s=[];
  for(let v=1;v<=n;v++)if(ok(g,r,c,v))s.push(v);
  if(bi<0||s.length<bs.length){bi=i;bs=s;if(!s.length)return 0}}
 if(bi<0)return 1;let t=0;
 for(const v of bs){g[bi]=v;t+=count(g,lim-t);g[bi]=0;if(t>=lim)break}return t}
function make(){cfg=L[lv];const n=cfg.n;sol=Array(n*n).fill(0);fill(sol);
 giv=sol.slice();let removed=0;
 for(const i of shuf([...Array(n*n).keys()])){if(removed>=cfg.rm)break;const v=giv[i];giv[i]=0;
  if(count(giv.slice(),2)===1)removed++;else giv[i]=v}
 cur=giv.slice();sel=-1;hints=3;done=false;att=0;okc=0;hu=0;t0=Date.now();
 build();draw();$("msg").classList.remove("show")}
function build(){const n=cfg.n,b=$("board");b.style.setProperty("--n",n);b.style.gridTemplateColumns=b.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;b.innerHTML="";
 for(let i=0;i<n*n;i++){const d=document.createElement("button");d.className="c";d.onclick=()=>{if(done)return;sel=i;draw()};
  const r=Math.floor(i/n),c=i%n;
  if(c%cfg.bc===0&&c)d.style.borderLeft="4px solid var(--thick)";
  if(r%cfg.br===0&&r)d.style.borderTop="4px solid var(--thick)";
  b.appendChild(d)}
 const p=$("pad");p.innerHTML="";
 for(let v=1;v<=n;v++){const k=document.createElement("button");k.textContent=v;k.onclick=()=>put(v);p.appendChild(k)}
 const e=document.createElement("button");e.className="e";e.textContent="けす";e.onclick=()=>put(0);p.appendChild(e)}
function bad(i){const n=cfg.n,v=cur[i];if(!v)return false;const r=Math.floor(i/n),c=i%n;
 for(let j=0;j<n*n;j++){if(j===i||cur[j]!==v)continue;const r2=Math.floor(j/n),c2=j%n;
  if(r2===r||c2===c||(Math.floor(r2/cfg.br)===Math.floor(r/cfg.br)&&Math.floor(c2/cfg.bc)===Math.floor(c/cfg.bc)))return true}return false}
function draw(){const cs=$("board").children,sv=sel>=0?cur[sel]:0,n=cfg.n,sr=sel>=0?Math.floor(sel/n):-9,sc=sel>=0?sel%n:-9;
 for(let i=0;i<cs.length;i++){const d=cs[i];d.textContent=cur[i]||"";
  const r=Math.floor(i/n),c=i%n;d.className="c"+(giv[i]?" g":"")+((Math.floor(r/cfg.br)+Math.floor(c/cfg.bc))%2?" a":"")+(sel>=0&&(r===sr||c===sc)?" h":"")+(i===sel?" s":(sv&&cur[i]===sv?" m":""))+(bad(i)?" x":"")}
 $("hc").textContent="💡 ヒント "+hints;
 [...$("lvs").children].forEach(b=>b.classList.toggle("on",b.dataset.k===lv))}
function put(v){if(done||sel<0||giv[sel])return;if(v>0){att++;if(v===sol[sel])okc++}cur[sel]=v;draw();check()}
function check(){if(cur.every((v,i)=>v===sol[i])){done=true;const s=Math.floor((Date.now()-t0)/1000);
 finish(s)}}
$("hint").onclick=()=>{if(done||hints<=0||sel<0||giv[sel])return;cur[sel]=sol[sel];hints--;hu++;draw();check()};
$("again").onclick=make;$("mb").onclick=make;
for(const k in L){const b=document.createElement("button");b.className="lv";b.dataset.k=k;b.textContent=L[k].t;b.onclick=()=>{lv=k;make()};$("lvs").appendChild(b)}
setInterval(()=>{if(!done){const s=Math.floor((Date.now()-t0)/1000);$("tm").textContent="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}},500);
const K={e:6,m:3,h:1.5,x:1};let last=null,rlv='e',dbh=null,shared=false;
const LS='nanpure-rank-v1';
const loadL=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}};
const saveL=a=>{try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){}};
const getName=()=>{try{return localStorage.getItem('nanpure-name')||''}catch(e){return''}};
const setName=n=>{try{localStorage.setItem('nanpure-name',n)}catch(e){}};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function finish(s){const acc=att?Math.round(okc/att*100):0,base=Math.max(100,Math.round(1000-s*K[lv])),score=Math.max(0,Math.round(base*acc/100)-100*hu);
 last={lv,sec:s,acc,hints:hu,score,at:Date.now(),saved:false};
 $('mt').innerHTML='タイム <b>'+fmt(s)+'</b>　せいかい率 <b>'+acc+'%</b><br>スコア <b>'+score+'</b>てん'+(hu?'（ヒント'+hu+'かい）':'');
 $('nm').value=getName();$('msg').classList.add('show')}
$('sv').onclick=async()=>{if(!last||last.saved)return;last.saved=true;const name=($('nm').value.trim()||'ななしさん').slice(0,8);setName(name);
 const rec={lv:last.lv,sec:last.sec,acc:last.acc,hints:last.hints,score:last.score,at:last.at,name};
 const a=loadL(),same=a.filter(r=>r.lv===rec.lv&&r.name===name).sort((x,y)=>y.score-x.score),prev=same[0],isBest=!prev||rec.score>prev.score;
 if(isBest)saveL(a.filter(r=>!(r.lv===rec.lv&&r.name===name)).concat(rec));
 const hl=isBest?rec.at:prev.at,note=isBest?'🎉 じこベスト こうしん！ ':'じこベストは'+prev.score+'てん。もういちど ちょうせん！ ';
 if(shared){try{const ref=dbh.collection('scores').doc(rec.lv+'_'+Array.from(name).map(ch=>ch.charCodeAt(0).toString(16)).join('-')),sn=await ref.get();if(!sn.exists||sn.data().score<rec.score)await ref.set(rec)}catch(e){shared=false}}
 $('msg').classList.remove('show');rlv=rec.lv;showRank(hl,note)};
async function showRank(hl,note){$('rank').classList.add('show');const tabs=$('rtabs');tabs.innerHTML='';
 for(const k in L){const b=document.createElement('button');b.textContent=L[k].t;b.className=k===rlv?'on':'';b.onclick=()=>{rlv=k;showRank()};tabs.appendChild(b)}
 let rows=loadL().filter(r=>r.lv===rlv).sort((x,y)=>y.score-x.score).slice(0,10),src='このChromebookのじこベスト';
 if(shared){try{const q=await dbh.collection('scores').where('lv','==',rlv).orderBy('score','desc').limit(10).get();rows=q.docs.map(d=>d.data());src='みんなのじこベスト'}catch(e){}}
 $('rsrc').textContent=(note||'')+src+'（スコア ＝ はやさ点 × せいかい率 − ヒント1かいで100てん）';
 const l=$('rlist');l.innerHTML='';
 if(!rows.length){l.textContent='まだ きろくが ありません。さいしょの 1 いに なろう！';return}
 rows.forEach((r,i)=>{const d=document.createElement('div');d.className='rr'+(hl&&r.at===hl?' me':'');
  [['🥇','🥈','🥉'][i]||(i+1),r.name,r.score+'てん',fmt(r.sec),r.acc+'%'].forEach(t=>{const s=document.createElement('span');s.textContent=t;d.appendChild(s)});l.appendChild(d)})}
(async()=>{try{const db=await claude.use('db'),u=await claude.use('user');if(db&&(!u||(await u.can('data.write'))!==false)){dbh=db;shared=true}}catch(e){}})();
$('rk').onclick=()=>{rlv=lv;showRank()};$('rc').onclick=()=>$('rank').classList.remove('show');
make();
</script>
</body>
</html>
